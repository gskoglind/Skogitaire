<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Solitaire">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05331c">
<title>Solitaire</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* The table (§3): green felt, white cards, warm yellow as the attention colour. */
  :root{
    --green:#1a5938;--red:#cc1c26;--yellow:#ffcc00;--panel:#212121;
    --dim:rgba(255,255,255,.65);--soft:rgba(255,255,255,.08);--soft-border:rgba(255,255,255,.18);
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#05331c;color:#fff;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;height:100dvh;user-select:none;-webkit-user-select:none}
  button{font:inherit;color:inherit}
  svg.i{width:20px;height:20px;fill:currentColor;flex:0 0 auto}
  canvas.layer{position:fixed;left:0;top:0;pointer-events:none}
  #surface{z-index:0}
  #overlay{z-index:40}
  .screen{position:fixed;inset:0;z-index:1;transition:opacity .3s}
  .screen.hidden{opacity:0;pointer-events:none}

  /* ---------- start screen ---------- */
  #start{overflow-y:auto;display:flex;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 16px 24px}
  #start .col{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:14px;margin:auto 0}
  #logo{width:130px;height:90px;position:relative}
  #logo canvas{position:absolute;left:38px;top:7px;width:54px;height:76px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
  h1{margin:0;font-size:52px;font-weight:900;letter-spacing:-.5px}
  .subtitle{color:var(--dim);font-size:17px;margin-top:-6px}
  .gamecard{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;border:1px solid var(--soft-border);
    background:var(--green);box-shadow:0 3px 8px rgba(0,0,0,.25);cursor:pointer;text-align:left}
  .gamecard.red{background:var(--red)}
  .gamecard .ic{width:34px;display:flex;justify-content:center;font-size:26px}
  .gamecard .ic svg{width:28px;height:28px}
  .gamecard .tx{flex:1}
  .gamecard .t{font-size:22px;font-weight:700}
  .gamecard .s{font-size:14px;color:rgba(255,255,255,.82);margin-top:2px}
  .gamecard .chev{opacity:.7}
  .tables{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
  .tables .lbl{color:var(--dim);font-size:13px}
  .tables .row{display:flex;gap:8px;width:100%}
  .tables button{flex:1;padding:9px 4px;border-radius:12px;border:1px solid var(--soft-border);background:var(--soft);font-weight:600;font-size:14px;cursor:pointer}
  .tables button.on{background:var(--green);border-color:var(--yellow);color:var(--yellow)}
  .smallbtn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;border:1px solid var(--soft-border);background:var(--soft);font-weight:600;font-size:16px;cursor:pointer}
  @media (max-height:520px){ #logo{display:none} h1{font-size:36px} #start .col{gap:7px} .gamecard{padding:9px 14px} }

  /* ---------- game screen ---------- */
  #game{display:flex;flex-direction:column}
  #topbar{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:rgba(0,0,0,.28);position:relative;z-index:30}
  .bb{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border:none;border-radius:10px;background:var(--green);font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap}
  .bb:disabled{opacity:.45;cursor:default}
  .bb .lbl{display:none}
  body.labels .bb .lbl{display:inline}
  .bb.iconly .lbl{display:none!important}
  .seg{display:inline-flex;height:36px;padding:3px;border-radius:10px;background:var(--green)}
  .seg button{border:none;background:none;border-radius:8px;padding:0 9px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
  .seg button.on{background:rgba(255,255,255,.9);color:var(--green)}
  #status{flex:1;text-align:center;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #wrap{flex:1 1 auto;position:relative;overflow-x:hidden;overflow-y:auto;touch-action:pan-y}
  body.landscape #wrap{overflow-y:hidden}
  #board{position:relative;touch-action:none}
  #board > canvas{position:absolute;left:0;top:0;pointer-events:none}
  .slot{position:absolute;border-radius:10%;background:rgba(255,255,255,.07);border:1.5px dashed rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.22);pointer-events:none}
  .slot .cellmark{width:36%;aspect-ratio:1;border:1.5px dashed rgba(255,255,255,.22);border-radius:15%}
  #seal{position:absolute;border-radius:50%;overflow:hidden;pointer-events:none;box-shadow:0 2% 4% rgba(0,0,0,.35)}
  #seal img{position:absolute;width:104.2%;height:104.2%;left:-2.1%;top:-2.1%}
  .card{position:absolute;left:0;top:0;background-size:100% 100%;border-radius:10%;will-change:transform;
    box-shadow:0 1px 1.5px rgba(0,0,0,.25);transition:transform .32s cubic-bezier(.34,1.18,.64,1)}
  .card.lifted{box-shadow:0 6px 8px rgba(0,0,0,.40);transition:none}
  .card.dealing{transition:transform .22s ease-out}
  .card.returning{transition:transform .35s cubic-bezier(.34,1.18,.64,1)}
  .card.hint,.pulse{animation:breath .5s ease-in-out infinite alternate}
  .card.hint::after,.pulse::after{content:"";position:absolute;inset:0;border-radius:10%;border:4px solid var(--yellow);box-shadow:0 0 12px 4px rgba(255,204,0,.7);animation:glow 1.26s linear infinite}
  .pulse{position:absolute;z-index:20000;pointer-events:none;border-radius:10%}
  @keyframes breath{from{scale:1}to{scale:1.09}}
  @keyframes glow{0%,100%{opacity:1}50%{opacity:.45}}

  /* ---------- menus, panels, sheets ---------- */
  #menu{position:fixed;z-index:60;min-width:220px;background:#2b2b2b;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.5);padding:6px 0;display:none}
  #menu .it{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;font-size:15px}
  #menu .it:hover{background:rgba(255,255,255,.08)}
  #menu .it .ck{width:20px}
  #menu hr{border:none;border-top:1px solid rgba(255,255,255,.12);margin:4px 0}
  #scrim{position:fixed;inset:0;z-index:55;display:none}
  .panel{position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.2);
    border-radius:22px;padding:20px 28px;display:none;flex-direction:column;align-items:center;gap:14px;max-width:calc(100vw - 32px)}
  .panel h2{margin:0;font-size:44px;font-weight:900;text-align:center}
  .panel .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .panel .cap{color:var(--dim);font-size:13px}
  .panel .gold{color:var(--yellow);font-weight:600;text-align:center}
  .scorecard{background:rgba(255,255,255,.92);border-radius:8px;padding:6px 8px;color:#000;display:grid;grid-template-columns:repeat(9,30px);text-align:center;font-weight:700}
  .scorecard .h{color:var(--green);font-size:12px}
  .scorecard .u{color:rgb(199,26,33)}
  .scorecard .n{color:gray}
  #golfpanel h2{font-size:34px}
  #golfpanel.dimmed{box-shadow:0 0 0 100vmax rgba(0,0,0,.25)}
  .sheet{position:fixed;inset:0;z-index:70;display:none;flex-direction:column}
  .sheet canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
  .sheet .head{display:flex;align-items:center;justify-content:center;position:relative;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
  .sheet .head h3{margin:0;font-size:20px}
  .sheet .head button{position:absolute;right:12px;background:none;border:none;color:var(--yellow);font-size:17px;font-weight:600;cursor:pointer}
  .sheet .body{flex:1;overflow-y:auto;padding:4px 16px 24px;display:flex;flex-direction:column;gap:14px;max-width:640px;width:100%;margin:0 auto;user-select:text}
  .sec{background:rgba(0,0,0,.22);border:1px solid var(--soft-border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:9px}
  .sec .st{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;color:var(--yellow)}
  .sec .st svg{width:20px;height:20px}
  .bul{display:flex;gap:8px;font-size:15px;line-height:21px;color:rgba(255,255,255,.9)}
  .bul:before{content:"◆";color:rgba(255,204,0,.8);font-size:10px;padding-top:1px}
  .vtitle{align-self:flex-start;display:flex;align-items:center;gap:8px;background:var(--green);border-radius:8px;padding:5px 10px;font-weight:700;font-size:17px}
  .boxes{display:flex;gap:10px}
  .box{flex:1;background:var(--soft);border-radius:10px;padding:10px 0;text-align:center}
  .box .v{font-size:24px;font-weight:700}.box .l{font-size:13px;color:var(--dim)}
  .best{display:flex;align-items:center;gap:6px;font-size:15px}
  .best .n{width:30px;color:var(--dim)}
  .resetbtn{align-self:center;background:none;border:none;color:#ff453a;font-size:16px;font-weight:600;cursor:pointer;padding:8px}
  #alert{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
  #alert .box2{background:#2b2b2b;border-radius:24px;padding:22px 24px 12px;max-width:340px;width:calc(100% - 48px)}
  #alert h4{margin:0 0 10px;font-size:22px;font-weight:500}
  #alert p{margin:0 0 16px;color:rgba(255,255,255,.75);font-size:15px;line-height:21px}
  #alert .acts{display:flex;justify-content:flex-end;gap:6px}
  #alert .acts button{background:none;border:none;color:var(--yellow);font-weight:600;font-size:15px;padding:10px 12px;cursor:pointer}
</style>
</head>
<body>
<canvas id="surface" class="layer"></canvas>

<div id="start" class="screen">
  <div class="col">
    <div id="logo"></div>
    <h1>Solitaire</h1>
    <div class="subtitle">Choose a game to play</div>
    <div id="cards" style="display:contents"></div>
    <div class="tables"><div class="lbl">Table</div><div class="row" id="tables"></div></div>
    <button class="smallbtn" id="statsbtn"></button>
    <div id="build" style="color:rgba(255,255,255,.35);font-size:11px"></div>
  </div>
</div>

<div id="game" class="screen hidden">
  <div id="topbar"></div>
  <div id="wrap"><div id="board"></div></div>
</div>

<canvas id="overlay" class="layer"></canvas>
<div id="winpanel" class="panel"></div>
<div id="golfpanel" class="panel"></div>
<div id="scrim"></div>
<div id="menu"></div>
<div id="sheet" class="sheet"><canvas></canvas><div class="head"><h3></h3><button>Done</button></div><div class="body"></div></div>
<div id="alert"><div class="box2"><h4></h4><p></p><div class="acts"></div></div></div>

<script src="js/seeded.js"></script>
<script src="js/engine.js"></script>
<script src="js/layout.js"></script>
<script src="js/loc-japan.js"></script>
<script src="js/loc-sydney.js"></script>
<script src="js/loc-bermuda.js"></script>
<script src="js/loc-savannah.js"></script>
<script src="js/cardart.js"></script>
<script src="js/celebration.js"></script>
<script src="js/app.js?v=6"></script>
</body>
</html>
